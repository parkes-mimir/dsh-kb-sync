# dsh-kb-sync —— bundle patch
# 行 id 必须与包名一致（设置页按包名匹配条目，才能渲染 Config 表单）
- insert:
    - id: dsh-kb-sync
      name: dsh-kb-sync
      config:
        remote: ''
        device: ''
        notifyUrl: ''
        notifyToken: ''
        # 敏感信息只留本机：随包默认，任何设备装上都是 local
        spaces:
          h3c-career:
            mode: local
          local-secrets:
            mode: local
