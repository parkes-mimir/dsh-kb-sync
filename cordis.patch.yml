# dsh-kb-sync —— bundle patch
# 行 id 必须与包名一致（设置页按包名匹配条目，才能渲染 Config 表单）
- insert:
    - id: dsh-kb-sync
      name: dsh-kb-sync
      config:
        remote: ''
        device: ''
        notifyUrl: ''
        notifyToken: ''
        # 默认哪些空间只留本机：h3c-career 含个人资料与简历，永不上云
        spaces:
          h3c-career:
            mode: local
